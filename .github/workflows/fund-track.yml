name: Fund Auto Track

on:
  schedule:
    # 北京时间 22:30 = UTC 14:30
    - cron: '30 14 * * *'
  workflow_dispatch:
  # 也可以手动触发

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 抓取基金净值并更新 data.json
        run: node scripts/fund-track.js

      - name: 提交更新（如有变动）
        run: |
          git config user.name "caoshan-bot"
          git config user.email "caoshan-bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "📊 自动更新基金净值 [$(date +'%Y-%m-%d %H:%M')]"
          git push
