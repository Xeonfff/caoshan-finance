<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📋 账单 - 草山账本</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#f0f2f5;padding:16px 12px 32px;max-width:500px;margin:0 auto;color:#1a1a2e}

/* 顶栏 */
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.header h1{font-size:22px;font-weight:700}
.header a{font-size:13px;color:#3b82f6;text-decoration:none}

/* tab切换 */
.tabs{display:flex;gap:0;margin-bottom:16px;background:#fff;border-radius:12px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.tab{flex:1;text-align:center;padding:10px 0;font-size:14px;font-weight:600;border-radius:10px;cursor:pointer;color:#999;transition:all .2s}
.tab.active{background:#1a1a2e;color:#fff}

/* 导航栏 */
.nav{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:16px;padding:12px 16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.nav .arrow{font-size:20px;cursor:pointer;color:#3b82f6;user-select:none;padding:4px 8px;border-radius:8px;transition:background .15s}
.nav .arrow:active{background:#f0f2f5}
.nav .arrow.disabled{color:#ddd;pointer-events:none}
.nav .center{text-align:center}
.nav .center .title{font-size:16px;font-weight:600;display:block}
.nav .center .sub{font-size:11px;color:#999;display:block;margin-top:2px}
.nav .today{font-size:12px;color:#3b82f6;cursor:pointer;padding:4px 10px;border-radius:8px;background:#f0f5ff;transition:background .15s}
.nav .today:active{background:#dbeafe}

/* 汇总卡片 */
.summary-card{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;border-radius:16px;padding:18px 20px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.1)}
.summary-card .label{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:4px}
.summary-card .num{font-size:28px;font-weight:700}
.summary-card .sub-info{font-size:12px;color:rgba(255,255,255,.4);margin-top:4px}

/* 账单卡片 */
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-header .date{font-size:15px;font-weight:600}
.card-header .total{font-size:15px;font-weight:700;color:#ef4444}
.card-header .total.green{color:#22c55e}

/* 明细行 */
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #f5f5f5;font-size:13px}
.row:last-child{border:none}
.row .tag{font-size:11px;background:#f0f2f5;padding:2px 8px;border-radius:99px;color:#666}
.row .amt{font-weight:600;white-space:nowrap}
.amt-out{color:#ef4444}
.amt-in{color:#22c55e}

/* 分类汇总 */
.cat-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}
.cat-row .cat-dot{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:6px}
.cat-row .cat-label{color:#666}
.cat-row .cat-amt{font-weight:600}

/* 空状态 */
.empty{text-align:center;color:#ccc;padding:40px 0;font-size:13px}
</style>
</head>
<body>

<div class="header">
  <h1>📋 账单</h1>
  <a href="index.html">← 返回账本</a>
</div>

<div class="tabs">
  <div class="tab active" data-tab="daily">日账单</div>
  <div class="tab" data-tab="monthly">月账单</div>
</div>

<div id="summaryArea"></div>
<div id="navArea"></div>
<div id="billList"></div>

<script>
// ====== tab切换 ======
let currentTab = 'daily';
document.querySelectorAll('.tab').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    currentTab = el.dataset.tab;
    if (DATA) render();
  });
});

// ====== 加载数据 ======
let DATA = {};
let dayList = [], monthList = [];
let dayIdx = 0, monthIdx = 0;

fetch('data.json').then(r=>r.json()).then(d=>{ DATA=d; buildIndex(); render(); }).catch(()=>{
  document.getElementById('billList').innerHTML = '<div class="empty">⚠️ 数据加载失败</div>';
});

// ====== 日期工具 ======
function parseDate(str) {
  const parts = str.split('/');
  return new Date(2026, parseInt(parts[0]) - 1, parseInt(parts[1]));
}
function fmtDate(str) {
  const d = parseDate(str);
  return `${d.getMonth()+1}月${d.getDate()}日`;
}
function fmtMonth(str) {
  const d = parseDate(str);
  return `${d.getFullYear()}年${d.getMonth()+1}月`;
}
const CAT_COLORS = ['#f97316','#3b82f6','#22c55e','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f59e0b'];

// ====== 构建索引 ======
function buildIndex() {
  const exp = DATA.expense || [];
  const inc = DATA.income || [];

  // 日索引
  const dayMap = {};
  [...exp, ...inc].forEach(r => {
    if (!dayMap[r.date]) dayMap[r.date] = true;
  });
  dayList = Object.keys(dayMap).sort((a, b) => parseDate(b) - parseDate(a));
  dayIdx = 0;

  // 月索引
  const monthMap = {};
  [...exp, ...inc].forEach(r => {
    const m = fmtMonth(r.date);
    monthMap[m] = true;
  });
  monthList = Object.keys(monthMap).sort().reverse();
  monthIdx = 0;
}

// ====== 主渲染 ======
function render() {
  const exp = DATA.expense || [];
  const inc = DATA.income || [];

  if (currentTab === 'daily') {
    renderDailyNav();
    renderDaily(exp, inc);
  } else {
    renderMonthlyNav();
    renderMonthly(exp, inc);
  }
}

// ====== 日导航 ======
function renderDailyNav() {
  if (!dayList.length) {
    document.getElementById('navArea').innerHTML = '';
    return;
  }
  const cur = dayList[dayIdx];
  const canPrev = dayIdx < dayList.length - 1;
  const canNext = dayIdx > 0;
  document.getElementById('navArea').innerHTML = `
    <div class="nav">
      <span class="arrow ${canPrev ? '' : 'disabled'}" onclick="goDay(${dayIdx + 1})">‹</span>
      <div class="center">
        <span class="title">${fmtDate(cur)}</span>
        <span class="sub">可查看共 ${dayList.length} 天</span>
      </div>
      <span class="arrow ${canNext ? '' : 'disabled'}" onclick="goDay(${dayIdx - 1})">›</span>
    </div>
  `;
}

function goDay(idx) {
  if (idx < 0 || idx >= dayList.length) return;
  dayIdx = idx;
  render();
}

// ====== 月导航 ======
function renderMonthlyNav() {
  if (!monthList.length) {
    document.getElementById('navArea').innerHTML = '';
    return;
  }
  const cur = monthList[monthIdx];
  const canPrev = monthIdx < monthList.length - 1;
  const canNext = monthIdx > 0;
  document.getElementById('navArea').innerHTML = `
    <div class="nav">
      <span class="arrow ${canPrev ? '' : 'disabled'}" onclick="goMonth(${monthIdx + 1})">‹</span>
      <div class="center">
        <span class="title">${cur}</span>
        <span class="sub">可查看共 ${monthList.length} 个月</span>
      </div>
      <span class="arrow ${canNext ? '' : 'disabled'}" onclick="goMonth(${monthIdx - 1})">›</span>
    </div>
  `;
}

function goMonth(idx) {
  if (idx < 0 || idx >= monthList.length) return;
  monthIdx = idx;
  render();
}

// ====== 日账单 ======
function renderDaily(expenses, incomes) {
  if (!dayList.length) {
    document.getElementById('summaryArea').innerHTML = '';
    document.getElementById('billList').innerHTML = '<div class="empty">暂无记录</div>';
    return;
  }

  const date = dayList[dayIdx];
  const dayExp = expenses.filter(r => r.date === date);
  const dayInc = incomes.filter(r => r.date === date);
  const dayOut = dayExp.reduce((s, r) => s + r.amount, 0);
  const dayIn = dayInc.reduce((s, r) => s + r.amount, 0);

  document.getElementById('summaryArea').innerHTML = `
    <div class="summary-card">
      <div class="label">${fmtDate(date)} 支出</div>
      <div class="num">¥${dayOut.toFixed(2)}</div>
      <div class="sub-info">${dayInc.length ? '收入 ¥' + dayIn.toFixed(2) : '无收入'}</div>
    </div>
  `;

  const rows = dayExp.map(r =>
    `<div class="row"><span>${r.item} <span class="tag">${r.category}</span></span><span class="amt amt-out">-¥${r.amount.toFixed(2)}</span></div>`
  ).join('');
  const inRows = dayInc.map(r =>
    `<div class="row"><span>${r.item}</span><span class="amt amt-in">+¥${r.amount.toFixed(2)}</span></div>`
  ).join('');

  document.getElementById('billList').innerHTML = `
    <div class="card">
      <div class="card-header">
        <span class="date">${fmtDate(date)}</span>
        <span class="total">-¥${dayOut.toFixed(2)}${dayIn > 0 ? ` · <span class="green">+¥${dayIn.toFixed(2)}</span>` : ''}</span>
      </div>
      ${inRows}${rows}
      ${!dayExp.length && !dayInc.length ? '<div class="empty">暂无明细</div>' : ''}
    </div>
  `;
}

// ====== 月账单 ======
function renderMonthly(expenses, incomes) {
  if (!monthList.length) {
    document.getElementById('summaryArea').innerHTML = '';
    document.getElementById('billList').innerHTML = '<div class="empty">暂无记录</div>';
    return;
  }

  const month = monthList[monthIdx];
  const moExp = expenses.filter(r => fmtMonth(r.date) === month);
  const moInc = incomes.filter(r => fmtMonth(r.date) === month);
  const monthOut = moExp.reduce((s, r) => s + r.amount, 0);
  const monthIn = moInc.reduce((s, r) => s + r.amount, 0);

  // 分类汇总
  const cats = {};
  moExp.forEach(r => { cats[r.category] = (cats[r.category] || 0) + r.amount; });
  const catKeys = Object.keys(cats);

  document.getElementById('summaryArea').innerHTML = `
    <div class="summary-card">
      <div class="label">${month} 总支出</div>
      <div class="num">¥${monthOut.toFixed(2)}</div>
      <div class="sub-info">${moInc.length ? '收入 ¥' + monthIn.toFixed(2) : '无收入'} · 共 ${moExp.length} 笔</div>
    </div>
  `;

  let catHtml = '';
  if (catKeys.length) {
    catHtml = '<div style="margin-top:8px;padding-top:8px;border-top:1px solid #f0f0f0">';
    catKeys.forEach((cat, i) => {
      const pct = (cats[cat] / monthOut * 100).toFixed(0);
      catHtml += `<div class="cat-row"><span><span class="cat-dot" style="background:${CAT_COLORS[i % CAT_COLORS.length]}"></span><span class="cat-label">${cat}</span></span><span class="cat-amt">¥${cats[cat].toFixed(2)} <span style="color:#999;font-size:11px">${pct}%</span></span></div>`;
    });
    catHtml += '</div>';
  }

  const rows = moExp.map(r =>
    `<div class="row"><span>${fmtDate(r.date)} ${r.item} <span class="tag">${r.category}</span></span><span class="amt amt-out">-¥${r.amount.toFixed(2)}</span></div>`
  ).join('');
  const inRows = moInc.map(r =>
    `<div class="row"><span>${fmtDate(r.date)} ${r.item}</span><span class="amt amt-in">+¥${r.amount.toFixed(2)}</span></div>`
  ).join('');

  document.getElementById('billList').innerHTML = `
    <div class="card">
      <div class="card-header">
        <span class="date">${month}</span>
        <span class="total">-¥${monthOut.toFixed(2)}${monthIn > 0 ? ` · <span class="green">+¥${monthIn.toFixed(2)}</span>` : ''}</span>
      </div>
      ${inRows}${rows}
      ${catHtml}
    </div>
  `;
}
</script>
</body>
</html>
