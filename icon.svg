<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- 钱袋/钱包 -->
  <g transform="translate(256,260)">
    <!-- 铜钱外圆 -->
    <circle r="140" fill="none" stroke="#f59e0b" stroke-width="20"/>
    <!-- 铜钱内方孔 -->
    <rect x="-40" y="-40" width="80" height="80" rx="8" fill="#f59e0b"/>
    <!-- 方孔内背景 -->
    <rect x="-24" y="-24" width="48" height="48" rx="4" fill="#1a1a2e"/>
    <!-- 向上的箭头 -->
    <polyline points="0,-90 0,-30" stroke="#22c55e" stroke-width="16" stroke-linecap="round"/>
    <polyline points="-30,-60 0,-90 30,-60" stroke="#22c55e" stroke-width="16" stroke-linecap="round" fill="none"/>
  </g>
  <!-- 草字 -->
  <text x="256" y="440" text-anchor="middle" font-family="serif" font-size="64" fill="#f59e0b" font-weight="bold">草</text>
</svg>
